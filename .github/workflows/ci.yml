name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conectaph_test
          POSTGRES_USER: conectaph
          POSTGRES_PASSWORD: conectaph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectaph -d conectaph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://conectaph:conectaph_test@localhost:5432/conectaph_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate -w backend
      - name: Prepare test database
        run: |
          npm run db:push -w backend
          npm run db:seed -w backend
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and frontend tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
