services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conectaph}
      POSTGRES_USER: ${POSTGRES_USER:-conectaph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectaph_dev}
    volumes:
      - conectaph_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conectaph_postgres:
